name: ShieldAd build and test

on:
  push:
    paths:
      - 'shieldad/**'
      - '.github/workflows/shieldad-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shieldad/package-lock.json
      - name: Install Node dependencies
        working-directory: shieldad
        run: npm ci
      - name: Test filter parser and extension runtime
        working-directory: shieldad
        run: npm test
      - name: Compile lists and package browser extensions
        working-directory: shieldad
        run: npm run build
      - name: Install Chrome for Testing
        working-directory: shieldad
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo npx --yes @puppeteer/browsers install chrome@stable --path /tmp/chrome --install-deps
          CHROME_BIN="$(find /tmp/chrome -type f -name chrome -perm -111 | head -n 1)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome binary not found" >&2
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Verify extension in real Chrome
        working-directory: shieldad
        shell: bash
        run: |
          set +e
          xvfb-run -a npm run test:browser > browser-test.log 2>&1
          status=$?
          cat browser-test.log
          if [ "$status" -eq 0 ]; then
            {
              echo '### Real Chrome extension verification'
              echo '```text'
              cat browser-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### Chrome integration failure'
              echo '```text'
              tail -n 120 browser-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 9 browser-test.log | while IFS= read -r line; do
              if [ -n "$line" ]; then printf '::error::%s\n' "$line"; fi
            done
          fi
          exit "$status"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Test Android and assemble both APK variants
        working-directory: shieldad/android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --max-workers=2 --console=plain testDebugUnitTest assembleDebug assembleRelease > gradle-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo '### Android Gradle failure'
              echo '```text'
              tail -n 120 gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^e: |\.kt:[0-9]+:[0-9]+:|^> Task .* FAILED|^FAILURE:|^\* What went wrong:|^> |Caused by:)' gradle-build.log | tail -n 30 | while IFS= read -r line; do
              if [ -n "$line" ]; then printf '::error::%s\n' "$line"; fi
            done
          fi
          tail -n 100 gradle-build.log
          exit "$status"
      - name: Upload browser extensions
        uses: actions/upload-artifact@v7
        with:
          name: shieldad-extensions
          path: shieldad/dist/*.zip
      - name: Upload real Chrome evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shieldad-browser-evidence
          path: shieldad/browser-test.log
      - name: Upload Android APKs
        uses: actions/upload-artifact@v7
        with:
          name: shieldad-android-apks
          path: shieldad/android/app/build/outputs/apk/**/*.apk
