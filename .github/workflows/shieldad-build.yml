name: ShieldAd build and test

on:
  push:
    paths:
      - 'shieldad/**'
      - '.github/workflows/shieldad-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shieldad/package-lock.json
      - name: Install Node dependencies
        working-directory: shieldad
        run: npm ci
      - name: Test filter parser
        working-directory: shieldad
        run: npm test
      - name: Compile lists and package browser extensions
        working-directory: shieldad
        run: npm run build
      - name: Install Chrome for Testing
        working-directory: shieldad
        run: npx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/shieldad-chrome"
      - name: Verify blocking in real Chrome
        working-directory: shieldad
        shell: bash
        run: |
          set +e
          CHROME_BIN=$(find "$RUNNER_TEMP/shieldad-chrome" -type f -path '*/chrome-linux64/chrome' -print -quit)
          if [ -z "$CHROME_BIN" ]; then echo 'Chrome for Testing executable was not installed'; exit 1; fi
          xvfb-run -a env SHIELDAD_HEADFUL=1 SHIELDAD_BROWSER_LOG=1 CHROME_BIN="$CHROME_BIN" npm run test:browser > browser-test.log 2>&1
          status=$?
          cat browser-test.log
          if [ "$status" -ne 0 ]; then
            {
              echo '### Chrome integration failure'
              echo '```text'
              tail -n 120 browser-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 45 browser-test.log | while IFS= read -r line; do
              if [ -n "$line" ]; then printf '::error::%s\n' "$line"; fi
            done
          fi
          exit "$status"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Test Android and assemble both APK variants
        working-directory: shieldad/android
        shell: bash
        run: |
          set +e
          ./gradlew --stacktrace --console=plain testDebugUnitTest assembleDebug assembleRelease > gradle-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo '### Android Gradle failure'
              echo '```text'
              tail -n 120 gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 45 gradle-build.log | while IFS= read -r line; do
              if [ -n "$line" ]; then printf '::error::%s\n' "$line"; fi
            done
          fi
          tail -n 100 gradle-build.log
          exit "$status"
      - name: Upload browser extensions
        uses: actions/upload-artifact@v7
        with:
          name: shieldad-extensions
          path: shieldad/dist/*.zip
      - name: Upload Android APKs
        uses: actions/upload-artifact@v7
        with:
          name: shieldad-android-apks
          path: shieldad/android/app/build/outputs/apk/**/*.apk
